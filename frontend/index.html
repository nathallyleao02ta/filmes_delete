<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Filmes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="page">
        <h1>Filmes Nathally e Lucas</h1>

        <form id="movie-form">
            <input type="hidden" id="movie-id">

            <div class="campo">
                <label for="title">Título</label>
                <input type="text" id="title" name="title" required>
            </div>

            <div class="campo">
                <label for="age">Ano de Lançamento</label>
                <input type="number" id="age" name="age" min="1888" max="2100">
            </div>

            <div class="campo">
                <label for="gender">Gênero</label>
                <input type="text" id="gender" name="gender" required>
            </div>

            <div class="campo">
                <label for="ageLimit">Classificação (anos)</label>
                <input type="number" id="ageLimit" name="ageLimit" min="0" value="0">
            </div>

            <div class="campo">
                <label for="duration">Duração (minutos)</label>
                <input type="number" id="duration" name="duration" min="1">
            </div>

            <div class="form-actions">
                <button type="submit" id="submit-btn">Cadastrar Filme</button>
                <button type="button" id="cancel-btn" class="secundario" hidden>Cancelar edição</button>
            </div>
        </form>

        <section class="filmes"></section>
    </div>

    <script src="script.js"></script>
</body>
</html>
